[project]
name = "fraud-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dereger325", email = "davidducnguyenvan1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "jupyterlab>=4.6.3",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "uvicorn[standard]>=0.52.3",
    "xgboost>=3.4.1",
]

[project.scripts]
fraud-api = "fraud_api:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
